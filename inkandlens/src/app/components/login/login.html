<div class="login-container">
  <div class="card glass">
    <div class="brand">
      <span class="logo-icon">📖</span>
      <h1>Ink & Lens</h1>
      <p class="subtitle">Online Book Club</p>
    </div>

    <div class="mode-selection" *ngIf="!showAdminPrompt">
      <button class="btn btn-primary" (click)="selectReader()">
        <span class="btn-icon">👓</span> I'm a Reader
      </button>
      <button class="btn btn-secondary" (click)="showAdminForm()">
        <span class="btn-icon">🔑</span> I'm an Admin
      </button>
    </div>

    <div class="admin-prompt-container" *ngIf="showAdminPrompt">
      <h3>Admin Verification</h3>
      <p>Enter the administrator authorization password to proceed.</p>
      
      <div class="form-group">
        <input 
          type="password" 
          [(ngModel)]="adminPassword" 
          placeholder="Enter Admin Password..." 
          class="form-control"
          (keyup.enter)="verifyAdmin()"
          autofocus
        />
        <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
      </div>

      <div class="button-group">
        <button class="btn btn-secondary btn-sm" (click)="cancelAdmin()">Back</button>
        <button class="btn btn-primary btn-sm" (click)="verifyAdmin()">Verify</button>
      </div>
    </div>
  </div>
</div>
